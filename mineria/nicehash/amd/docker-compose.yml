services:
  nicehash:
    image: dockerhubnh/nicehash:latest
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      - MINING_ADDRESS=${MINING_ADDRESS}
      - MINING_WORKER_NAME=${MINING_WORKER_NAME}
    env_file:
      - .env
    entrypoint: /usr/bin/clinfo
    stdin_open: true
    tty: true
    restart: "no"